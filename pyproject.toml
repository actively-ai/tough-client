[project]
name = "tough-client"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anyio>=4.10; python_version < '3.10'",
    "anyio>=4.14.2; python_version >= '3.10'",
    "idna>=3.15",
    "click>=8.1.8",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "uvicorn==0.34.0",
]

[tool.poetry]
name = "tough-client"
version = "0.1.0"
description = ""
authors = ["Actively Engineering <engineering@actively.ai>"]
readme = "README.md"

[tool.poetry.dependencies]
anyio = [
    {version = ">=4.10", python = "<3.10"},
    {version = ">=4.14.2", python = ">=3.10"},
]
idna = ">=3.15"
python = ">=3.9"
click = ">=8.1.8"
fastapi = ">=0.115.12"
httpx = ">=0.28.1"
tenacity = ">=9.0.0"
uvicorn = "0.34.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
package = false
